<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senha</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f3;color:#172019}.wrap{max-width:1000px;margin:auto;padding:22px}.box{background:#fff;border-radius:24px;padding:26px;box-shadow:0 10px 30px #0000000b;margin:18px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{display:inline-block;padding:12px 16px;border:0;border-radius:13px;background:#151815;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}input,textarea{width:100%;padding:13px;border:1px solid #dce2dc;border-radius:12px;font-size:16px}textarea{min-height:90px}.msg{padding:12px;border-radius:12px;margin:12px 0;background:#eef2ee}.erro{background:#fff0f0;color:#8b2020}.sucesso{background:#edf8ef;color:#246333}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}table{width:100%;border-collapse:collapse;min-width:750px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}.scroll{overflow:auto}a{color:#245c3b}nav{background:#fff;padding:15px 22px;border-bottom:1px solid #ddd}.nav{max-width:1000px;margin:auto;display:flex;justify-content:space-between}.hero{background:linear-gradient(135deg,#173b27,#397451);color:#fff;border-radius:28px;padding:55px 28px}.hero h1{font-size:clamp(40px,8vw,65px);margin:0 0 12px}.links a{margin-left:10px;text-decoration:none}footer{text-align:center;background:#151815;color:white;padding:30px;margin-top:40px}</head><body><div class="wrap" style="max-width:650px"><div class="box"><h1>Senha administrativa</h1><p>A senha desta versão fica na variável <b>ADMIN_PASSWORD</b> do Render.</p><p>Para mudar: Render → Environment → ADMIN_PASSWORD → nova senha → Save Changes → redeploy.</p><a class="btn" href="/admin">Voltar</a></div></div></body></html>
